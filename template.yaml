AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Travel Supporters website and registration API
Parameters:
  ExistingWebsiteOrigin:
    Type: String
    Default: ''
    AllowedValues: ['', 'https://travelsupporters.com']
    Description: HTTPS origin when deploying the API for the existing website.
  AdminCloudFrontOrigin:
    Type: String
    Default: ''
    AllowedPattern: '^$|^https://[a-z0-9]+[.]cloudfront[.]net$'
    Description: HTTPS origin of the existing CloudFront distribution for administrator sign-in.
  EmailSender:
    Type: String
    Default: ''
    Description: Verified Amazon SES sender address in this region. Leave empty for manual invitations.
  MatchAlertEmail:
    Type: String
    Default: ''
    Description: Administrator email for new-match alerts.
Conditions:
  HasAdminCloudFrontOrigin: !Not [!Equals [!Ref AdminCloudFrontOrigin, '']]
  CreateWebsite: !Equals [!Ref ExistingWebsiteOrigin, '']
Resources:
  WebsiteBucket:
    Type: AWS::S3::Bucket
    Condition: CreateWebsite
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
  Registrations:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: listing
          AttributeType: S
        - AttributeName: date
          AttributeType: S
      GlobalSecondaryIndexes:
        - IndexName: PublicTrips
          KeySchema:
            - AttributeName: listing
              KeyType: HASH
            - AttributeName: date
              KeyType: RANGE
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes: [role, from, to, support]
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
  RegistrationApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: [https://travelsupporters.com]
        AllowHeaders: [authorization, content-type]
        AllowMethods: [GET, POST, PATCH]
        MaxAge: 600
      Auth:
        Authorizers:
          ListingAdmin:
            IdentitySource: "$request.header.Authorization"
            JwtConfiguration:
              issuer: !Sub 'https://cognito-idp.${AWS::Region}.${AWS::URLSuffix}/${AdminPool}'
              audience: [!Ref AdminClient]
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 5
  Register:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: registrations.handler
      Runtime: python3.13
      Timeout: 8
      Environment:
        Variables:
          TABLE_NAME: !Ref Registrations
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt Registrations.Arn
            - Effect: Allow
              Action: dynamodb:Query
              Resource: !Sub '${Registrations.Arn}/index/PublicTrips'
            - Effect: Allow
              Action: dynamodb:BatchGetItem
              Resource: !GetAtt Registrations.Arn
              Condition:
                ForAllValues:StringEquals:
                  dynamodb:Attributes: [id, publicLanguage, matchConfirmed]
                'Null':
                  dynamodb:Attributes: 'false'
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt Registrations.Arn
              Condition:
                ForAllValues:StringEquals:
                  dynamodb:Attributes: [id, role, from, to, date, listing, matchConfirmed]
                'Null':
                  dynamodb:Attributes: 'false'
      Events:
        RegisterTrip:
          Type: HttpApi
          Properties:
            ApiId: !Ref RegistrationApi
            Path: /api/registrations
            Method: POST
        ListTrips:
          Type: HttpApi
          Properties:
            ApiId: !Ref RegistrationApi
            Path: /api/registrations
            Method: GET
  AdminPool:
    Type: AWS::Cognito::UserPool
    Properties:
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      UsernameAttributes: [email]
      UsernameConfiguration:
        CaseSensitive: false
  AdminClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref AdminPool
      GenerateSecret: false
      SupportedIdentityProviders: [COGNITO]
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid]
      CallbackURLs:
        - https://travelsupporters.com/admin.html
        - !If [HasAdminCloudFrontOrigin, !Sub '${AdminCloudFrontOrigin}/admin.html', !Ref 'AWS::NoValue']
      LogoutURLs:
        - https://travelsupporters.com/admin.html
        - !If [HasAdminCloudFrontOrigin, !Sub '${AdminCloudFrontOrigin}/admin.html', !Ref 'AWS::NoValue']
      AccessTokenValidity: 15
      TokenValidityUnits:
        AccessToken: minutes
      PreventUserExistenceErrors: ENABLED
  AdminDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !If
        - CreateWebsite
        - !Sub '${AWS::StackName}-admin-${AWS::AccountId}-${AWS::Region}'
        - !Sub '${AWS::StackName}-existing-admin-${AWS::AccountId}-${AWS::Region}'
      UserPoolId: !Ref AdminPool
  ManageListings:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: admin.handler
      Runtime: python3.13
      Timeout: 8
      Environment:
        Variables:
          TABLE_NAME: !Ref Registrations
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:Scan, dynamodb:UpdateItem]
              Resource: !GetAtt Registrations.Arn
      Events:
        Review:
          Type: HttpApi
          Properties:
            ApiId: !Ref RegistrationApi
            Path: /api/admin/listings
            Method: GET
            Auth:
              Authorizer: ListingAdmin
              AuthorizationScopes: [openid]
        ChangeListing:
          Type: HttpApi
          Properties:
            ApiId: !Ref RegistrationApi
            Path: /api/admin/listings
            Method: PATCH
            Auth:
              Authorizer: ListingAdmin
              AuthorizationScopes: [openid]
  TripCoordination:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: coordination.handler
      Runtime: python3.13
      Timeout: 60
      Environment:
        Variables:
          TABLE_NAME: !Ref Registrations
          ENGAGEMENT_TABLE: !Ref EngagementTable
          CLOUDFRONT_ORIGIN: !Ref AdminCloudFrontOrigin
          SITE_ORIGIN: !If [HasAdminCloudFrontOrigin, !Ref AdminCloudFrontOrigin, 'https://travelsupporters.com']
          EMAIL_SENDER: !Ref EmailSender
          ALERT_EMAIL: !Ref MatchAlertEmail
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:Scan, dynamodb:UpdateItem]
              Resource: !GetAtt Registrations.Arn
            - Effect: Allow
              Action: [dynamodb:Scan, dynamodb:UpdateItem]
              Resource: !GetAtt EngagementTable.Arn
            - Effect: Allow
              Action: ses:SendEmail
              Resource: '*'
              Condition:
                StringEquals:
                  ses:FromAddress: !Ref EmailSender
      Events:
        PrivateTrip:
          Type: HttpApi
          Properties:
            ApiId: !Ref RegistrationApi
            Path: /api/trip
            Method: POST
        ManageMatches:
          Type: HttpApi
          Properties:
            ApiId: !Ref RegistrationApi
            Path: /api/admin/coordination
            Method: POST
            Auth:
              Authorizer: ListingAdmin
              AuthorizationScopes: [openid]
        Notifications:
          Type: Schedule
          Properties:
            Schedule: rate(1 hour)
  EngagementTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
  TripEngagement:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: engagement.handler
      Runtime: python3.13
      Timeout: 12
      Environment:
        Variables:
          TABLE_NAME: !Ref Registrations
          ENGAGEMENT_TABLE: !Ref EngagementTable
          SITE_ORIGIN: !If [HasAdminCloudFrontOrigin, !Ref AdminCloudFrontOrigin, 'https://travelsupporters.com']
          EMAIL_SENDER: !Ref EmailSender
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt Registrations.Arn
              Condition:
                ForAllValues:StringEquals:
                  dynamodb:Attributes: [id, listing, from, to, date]
                'Null':
                  dynamodb:Attributes: 'false'
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:Scan]
              Resource: !GetAtt EngagementTable.Arn
            - Effect: Allow
              Action: ses:SendEmail
              Resource: '*'
              Condition:
                StringEquals:
                  ses:FromAddress: !Ref EmailSender
      Events:
        Alerts:
          Type: HttpApi
          Properties:
            ApiId: !Ref RegistrationApi
            Path: /api/alerts
            Method: POST
        Reports:
          Type: HttpApi
          Properties:
            ApiId: !Ref RegistrationApi
            Path: /api/reports
            Method: POST
        ReviewReports:
          Type: HttpApi
          Properties:
            ApiId: !Ref RegistrationApi
            Path: /api/admin/reports
            Method: POST
            Auth:
              Authorizer: ListingAdmin
              AuthorizationScopes: [openid]
  CommunityDirectory:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
  ManageCommunities:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: communities.handler
      Runtime: python3.13
      Timeout: 8
      Environment:
        Variables:
          COMMUNITIES_TABLE: !Ref CommunityDirectory
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:Scan, dynamodb:PutItem, dynamodb:DeleteItem]
              Resource: !GetAtt CommunityDirectory.Arn
      Events:
        ListCommunities:
          Type: HttpApi
          Properties:
            ApiId: !Ref RegistrationApi
            Path: /api/communities
            Method: GET
        EditCommunities:
          Type: HttpApi
          Properties:
            ApiId: !Ref RegistrationApi
            Path: /api/admin/communities
            Method: POST
            Auth:
              Authorizer: ListingAdmin
              AuthorizationScopes: [openid]
  WebsiteAccess:
    Type: AWS::CloudFront::OriginAccessControl
    Condition: CreateWebsite
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-website'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
  Distribution:
    Type: AWS::CloudFront::Distribution
    Condition: CreateWebsite
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: Website
            DomainName: !GetAtt WebsiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt WebsiteAccess.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
          - Id: RegistrationApi
            DomainName: !Sub '${RegistrationApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
        DefaultCacheBehavior:
          TargetOriginId: Website
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          Compress: true
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: RegistrationApi
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
  WebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: CreateWebsite
    Properties:
      Bucket: !Ref WebsiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${WebsiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'
Outputs:
  WebsiteBucketName:
    Condition: CreateWebsite
    Value: !Ref WebsiteBucket
  WebsiteUrl:
    Condition: CreateWebsite
    Value: !Sub 'https://${Distribution.DomainName}'
  RegistrationEndpoint:
    Value: !Sub 'https://${RegistrationApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/api/registrations'
  RegistrationsTableName:
    Value: !Ref Registrations
  AdminPoolId:
    Value: !Ref AdminPool
  AdminConfig:
    Value: !Sub >-
      {"clientId":"${AdminClient}","cloudFrontOrigin":"${AdminCloudFrontOrigin}","loginOrigin":"https://${AdminDomain}.auth.${AWS::Region}.amazoncognito.com","api":"https://${RegistrationApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/api/admin/listings"}
